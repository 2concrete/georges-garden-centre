<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>George's Garden Centre | Contact</title>
    <link rel="stylesheet" href="css/reset.css" />
    <link rel="stylesheet" href="css/core.css" />
    <link rel="stylesheet" href="css/components/header-nav.css" />
    <link rel="stylesheet" href="css/components/form.css" />
    <link rel="stylesheet" href="css/custom.css" />
  </head>
  <body>
    <a href="#main" class="skip-link">Skip to main content</a>
    <header class="site-header drawer-right">
      <div class="site-header__inner container">
        <a class="site-header__brand" href="index.html">George's Garden</a
        ><button
          class="site-header__toggle"
          type="button"
          popovertarget="site-nav"
          aria-label="Menu"
        >
          <span aria-hidden="true">☰</span
          ><span class="visually-hidden">Menu</span>
        </button>
        <nav
          id="site-nav"
          class="site-nav"
          popover
          aria-label="Main navigation"
        >
          <a class="site-nav__link" href="index.html">Home</a
          ><a class="site-nav__link" href="shop.html">Shop</a
          ><a class="site-nav__link" href="guide.html">Guide</a
          ><a class="site-nav__link" href="contact.html">Contact</a>
        </nav>
      </div>
    </header>
    <main id="main">
      <div class="auto-grid container">
        <section class="section">
          <form class="form card stack">
            <div class="form__field stack">
              <label class="form__label" for="name">Full name</label
              ><input
                class="form__input"
                id="name"
                name="name"
                type="text"
                placeholder="Jane Smith"
                required
              />
            </div>
            <div class="form__field stack">
              <label class="form__label" for="email">Email address</label
              ><input
                class="form__input"
                id="email"
                name="email"
                type="email"
                placeholder="jane@example.com"
                required
              />
              <p class="form__help">We will only use this to reply.</p>
            </div>
            <div class="form__field stack">
              <label class="form__label" for="message">Message</label
              ><textarea
                class="form__textarea"
                id="message"
                name="message"
                placeholder="Message..."
                required
              ></textarea>
            </div>
            <div class="cluster">
              <button class="btn btn--primary" type="submit">
                Send message</button
              ><button class="btn btn--secondary" type="reset">Reset</button>
            </div>
          </form>
        </section>
      </div>
    </main>
    <footer class="site-footer">
      <div class="container stack">
        <h2 class="site-footer__title">George's Garden Centre</h2>
        <nav class="site-footer__nav" aria-label="Footer navigation">
          <a href="index.html">Home</a><a href="shop.html">Shop</a
          ><a href="guide.html">Guide</a><a href="contact.html">Contact</a>
        </nav>
        <p class="site-footer__copyright">Prototype site, 2026</p>
      </div>
    </footer>
  </body>
</html>
